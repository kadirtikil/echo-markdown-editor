name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy manually from the Actions tab.
  workflow_dispatch:

# GITHUB_TOKEN needs these to publish a Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run type-check

      - run: pnpm test

      - name: Build
        # Project sites live at /<repo>/; this makes asset URLs match.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      # "enablement" turns Pages on via the API if it is not already enabled,
      # rather than failing with "Get Pages site failed / Not Found". The manual
      # equivalent is Settings > Pages > Source: GitHub Actions.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          # "dist" is the published package; the demo site builds to "demo-dist".
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
